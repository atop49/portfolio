<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="meteor-title">
  <title id="meteor-title">Night hillside under a meteor shower, with a countdown card</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset=".45" stop-color="#1a2740"/>
      <stop offset="1" stop-color="#2a3a56"/>
    </linearGradient>
    <linearGradient id="hill-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a42"/>
      <stop offset="1" stop-color="#131c2e"/>
    </linearGradient>
    <linearGradient id="hill-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#cfe4ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#cfe4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dceaff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#dceaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx=".5" cy="1" r=".8">
      <stop offset="0" stop-color="#2b3d5e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2b3d5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="470" width="1600" height="330" fill="url(#horizon)"/>

  <!-- stars -->
  <g fill="#e8f1ff">
    <circle cx="140" cy="120" r="2.4" opacity=".85"/>
    <circle cx="286" cy="206" r="1.6" opacity=".55"/>
    <circle cx="402" cy="96" r="2" opacity=".7"/>
    <circle cx="520" cy="184" r="1.4" opacity=".45"/>
    <circle cx="640" cy="72" r="2.6" opacity=".9"/>
    <circle cx="742" cy="150" r="1.5" opacity=".5"/>
    <circle cx="864" cy="104" r="2.2" opacity=".75"/>
    <circle cx="966" cy="196" r="1.4" opacity=".45"/>
    <circle cx="1074" cy="86" r="2.8" opacity=".9"/>
    <circle cx="1188" cy="172" r="1.6" opacity=".55"/>
    <circle cx="1292" cy="112" r="2.2" opacity=".7"/>
    <circle cx="1408" cy="190" r="1.5" opacity=".5"/>
    <circle cx="1502" cy="98" r="2.4" opacity=".8"/>
    <circle cx="212" cy="312" r="1.6" opacity=".45"/>
    <circle cx="356" cy="372" r="2" opacity=".6"/>
    <circle cx="486" cy="300" r="1.4" opacity=".4"/>
    <circle cx="618" cy="376" r="1.8" opacity=".55"/>
    <circle cx="760" cy="318" r="1.4" opacity=".4"/>
    <circle cx="898" cy="392" r="2" opacity=".6"/>
    <circle cx="1032" cy="318" r="1.5" opacity=".45"/>
    <circle cx="1166" cy="392" r="1.8" opacity=".55"/>
    <circle cx="1304" cy="330" r="1.4" opacity=".4"/>
    <circle cx="1440" cy="400" r="2" opacity=".6"/>
    <circle cx="1560" cy="300" r="1.6" opacity=".5"/>
    <circle cx="92" cy="392" r="1.5" opacity=".42"/>
    <circle cx="540" cy="232" r="1.3" opacity=".38"/>
    <circle cx="1008" cy="252" r="1.3" opacity=".38"/>
    <circle cx="1352" cy="232" r="1.3" opacity=".38"/>
  </g>

  <!-- meteor streaks -->
  <g stroke-linecap="round">
    <path d="M1246 118 L672 520" stroke="url(#trail)" stroke-width="7"/>
    <path d="M1382 250 L1010 520" stroke="url(#trail2)" stroke-width="4"/>
    <path d="M404 168 L236 330" stroke="url(#trail2)" stroke-width="3"/>
  </g>
  <circle cx="1246" cy="118" r="46" fill="url(#glow)"/>
  <circle cx="1246" cy="118" r="5.5" fill="#ffffff"/>
  <circle cx="1382" cy="250" r="26" fill="url(#glow)"/>

  <!-- far ridge -->
  <path d="M0 556 L188 470 L332 540 L470 462 L622 552 L760 486 L912 560 L1064 488 L1216 556 L1372 480 L1520 552 L1600 512 L1600 900 L0 900 Z" fill="url(#hill-far)"/>

  <!-- near ridge -->
  <path d="M0 668 C 180 610 320 700 470 662 C 640 618 760 706 920 674 C 1080 642 1200 716 1360 682 C 1460 660 1540 690 1600 672 L1600 900 L0 900 Z" fill="url(#hill-near)"/>

  <!-- tripod silhouette -->
  <g stroke="#05080f" fill="none">
    <path d="M1290 706 L1330 604 M1330 604 L1370 706" stroke-width="7"/>
    <path d="M1330 604 L1330 676" stroke-width="6"/>
    <path d="M1298 640 L1362 640" stroke-width="5"/>
  </g>
  <rect x="1300" y="592" width="60" height="16" rx="8" fill="#05080f"/>

  <!-- countdown card -->
  <g>
    <rect x="556" y="286" width="488" height="176" rx="20" fill="#1b2740" opacity=".95"/>
    <rect x="556.5" y="286.5" width="487" height="175" rx="19.5" fill="none" stroke="#9fb7e4" stroke-opacity=".5"/>
    <text x="588" y="330" fill="#dbe7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">2026 · 北金牛座流星雨</text>
    <text x="588" y="402" fill="#ffe6b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="52" letter-spacing="1">5 天 01 时 02 分</text>
    <text x="588" y="436" fill="#a6bade" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">PEAK · 11.12   ZHR 15</text>
    <circle cx="966" cy="322" r="6" fill="#ffd28a"/>
  </g>

</svg>