<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebf5"/>
      <stop offset="0.55" stop-color="#eef3ec"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <linearGradient id="glasscard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db8a4"/>
      <stop offset="1" stop-color="#7a9a85"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1305" cy="175" r="62" fill="#2a6fa8" opacity="0.9"/>
  <circle cx="1305" cy="175" r="82" fill="none" stroke="#2a6fa8" stroke-width="2" opacity="0.35"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="360" cy="185" rx="150" ry="46"/>
    <ellipse cx="450" cy="160" rx="110" ry="38"/>
    <ellipse cx="280" cy="165" rx="90" ry="32"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="980" cy="120" rx="120" ry="34"/>
    <ellipse cx="1060" cy="100" rx="80" ry="26"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="700" cy="260" rx="95" ry="26"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 700 Q 320 590 640 660 T 1600 640 V 900 H 0 Z" fill="url(#hill)"/>
  <path d="M0 780 Q 400 700 800 760 T 1600 740 V 900 H 0 Z" fill="#6d8f79"/>

  <!-- main glass weather card -->
  <g>
    <rect x="250" y="330" width="640" height="360" rx="10" fill="url(#glasscard)" stroke="#111111" stroke-opacity="0.14" stroke-width="1.5"/>
    <text x="310" y="412" font-family="Georgia, serif" font-size="44" fill="#111111" letter-spacing="2">Shanghai</text>
    <text x="310" y="540" font-family="'Courier New', monospace" font-size="130" font-weight="bold" fill="#111111">20°</text>
    <text x="560" y="540" font-family="Georgia, serif" font-size="40" fill="#8c877d">°C</text>
    <!-- cloud + sun mini icon -->
    <g transform="translate(600,440)">
      <circle cx="52" cy="18" r="26" fill="#2a6fa8"/>
      <ellipse cx="30" cy="52" rx="58" ry="26" fill="#f5f1e8"/>
      <ellipse cx="68" cy="58" rx="44" ry="22" fill="#ece6d9"/>
    </g>
    <!-- stats -->
    <g font-family="'Courier New', monospace" font-size="22" fill="#8c877d">
      <text x="310" y="610">湿度 61%</text>
      <text x="470" y="610">风速 4.3 m/s</text>
      <text x="680" y="610">体感 19°</text>
    </g>
    <rect x="310" y="645" width="120" height="2" fill="#2a6fa8"/>
    <text x="310" y="668" font-family="'Courier New', monospace" font-size="16" fill="#8c877d" letter-spacing="3">OBSERVED 15:05</text>
  </g>

  <!-- forecast strip: five small glass cards -->
  <g>
    <g transform="translate(950,360)">
      <rect width="120" height="150" rx="6" fill="url(#glasscard)" stroke="#111111" stroke-opacity="0.12"/>
      <text x="60" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#8c877d">周六</text>
      <circle cx="60" cy="65" r="17" fill="#2a6fa8"/>
      <text x="60" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#111111">20° 16°</text>
    </g>
    <g transform="translate(1090,360)">
      <rect width="120" height="150" rx="6" fill="url(#glasscard)" stroke="#111111" stroke-opacity="0.12"/>
      <text x="60" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#8c877d">周日</text>
      <ellipse cx="60" cy="68" rx="24" ry="13" fill="#ece6d9" stroke="#111111" stroke-opacity="0.25"/>
      <text x="60" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#111111">18° 16°</text>
    </g>
    <g transform="translate(1230,360)">
      <rect width="120" height="150" rx="6" fill="url(#glasscard)" stroke="#111111" stroke-opacity="0.12"/>
      <text x="60" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#8c877d">周一</text>
      <ellipse cx="60" cy="68" rx="24" ry="13" fill="#d5dde2" stroke="#111111" stroke-opacity="0.25"/>
      <text x="60" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#111111">16° 11°</text>
    </g>
    <g transform="translate(1370,360)">
      <rect width="120" height="150" rx="6" fill="url(#glasscard)" stroke="#111111" stroke-opacity="0.12"/>
      <text x="60" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#8c877d">周二</text>
      <ellipse cx="60" cy="68" rx="24" ry="13" fill="#c9d3da" stroke="#111111" stroke-opacity="0.25"/>
      <text x="60" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#111111">16° 11°</text>
    </g>
  </g>

  <!-- location pin + search bar hint -->
  <g transform="translate(950,600)">
    <rect width="330" height="64" rx="6" fill="#ffffff" fill-opacity="0.6" stroke="#111111" stroke-opacity="0.14"/>
    <circle cx="36" cy="32" r="8" fill="none" stroke="#111111" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M36 18 v-4 M36 50 v-4 M22 32 h-4 M54 32 h-4" stroke="#111111" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="40" font-family="'Courier New', monospace" font-size="20" fill="#8c877d">上海 · Tokyo · Paris…</text>
  </g>

  <!-- ground shadow line -->
  <rect x="0" y="878" width="1600" height="22" fill="#5f7f6c"/>
</svg>
